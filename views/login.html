<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Petugas — Sistem Inventaris Olahraga Sekolah</title>
  <link href="/css/output.css" rel="stylesheet">
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-slate-200 overflow-hidden">
    <!-- Header Banner -->
    <div class="bg-blue-900 px-6 py-6 text-white">
      <span class="text-xs font-semibold uppercase tracking-wider text-blue-300">Gudang Olahraga Sekolah</span>
      <h1 class="text-xl font-bold mt-1">Masuk ke Sistem Inventaris</h1>
      <p class="text-xs text-blue-200 mt-1">Silakan masukkan kredensial akun petugas gudang Anda.</p>
    </div>

    <!-- Form Login -->
    <div class="p-6">
      <div id="login-alert" class="hidden mb-4 px-4 py-3 rounded-xl text-xs font-medium border"></div>

      <form id="form-login" class="space-y-4 text-sm">
        <div>
          <label for="email" class="block font-medium text-slate-700 mb-1">Email Petugas</label>
          <input
            type="email"
            id="email"
            name="email"
            required
            autocomplete="email"
            placeholder="petugas@sekolah.sch.id"
            class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-600"
          >
        </div>

        <div>
          <label for="password" class="block font-medium text-slate-700 mb-1">Password</label>
          <div class="relative">
            <input
              type="password"
              id="password"
              name="password"
              required
              autocomplete="current-password"
              placeholder="Masukkan password"
              class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 pr-16 focus:outline-none focus:ring-2 focus:ring-blue-600"
            >
            <button
              type="button"
              id="toggle-password"
              class="absolute inset-y-0 right-0 px-3 text-xs font-medium text-slate-500 hover:text-slate-800 cursor-pointer"
            >
              Lihat
            </button>
          </div>
        </div>

        <button
          type="submit"
          id="btn-submit-login"
          class="w-full bg-blue-800 hover:bg-blue-900 disabled:bg-blue-400 text-white font-semibold py-2.5 px-4 rounded-lg transition cursor-pointer"
        >
          Masuk (Login)
        </button>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
